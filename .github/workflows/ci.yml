name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Lint, testes e build (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: 22
          - os: ubuntu-latest
            node: 24
          - os: windows-latest
            node: 24
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Instalar dependências
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Testes (SQLite)
        run: npm test
      - name: Build da interface
        run: npm run build

  postgres:
    name: Testes com PostgreSQL
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: stardew
          POSTGRES_PASSWORD: stardew
          POSTGRES_DB: stardew_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U stardew"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://stardew:stardew@localhost:5432/stardew_test
      API_TEST_PG: postgres://stardew:stardew@localhost:5432/stardew_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Persistência e API no PostgreSQL
        run: npm run test:pg

  docker:
    name: Build da imagem Docker
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Servidor
        run: docker build -t stardew-monitor:ci .
      - name: Agente
        run: docker build -f agent/Dockerfile -t stardew-agent:ci .

  app:
    name: Aplicativo baixável (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: test
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Gerar o executável
        run: npm run app:build
      - name: Testar o executável (sobe, responde e encerra)
        shell: bash
        run: |
          EXE=$(ls release/StardewMonitor-*)
          PORT=3555 "$EXE" --no-browser --data "$RUNNER_TEMP/dados" &
          for i in $(seq 1 40); do curl -sf http://localhost:3555/api/health && break; sleep 1; done
          curl -sf http://localhost:3555/api/health | grep -q stardew-monitor
          curl -sf http://localhost:3555/ | grep -q "<!doctype html>"
          kill %1 || true
      - uses: actions/upload-artifact@v4
        with:
          name: StardewMonitor-${{ runner.os }}
          path: release/StardewMonitor-*
          if-no-files-found: error

  release:
    name: Publicar versão (tags v*)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: app
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - name: Criar a Release com os executáveis
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" release/* --repo "${{ github.repository }}" --title "Stardew Monitor ${{ github.ref_name }}" --notes "Baixe o arquivo do seu sistema e abra. Windows: StardewMonitor-windows-x64.exe · Linux: StardewMonitor-linux-x64 (chmod +x)."
