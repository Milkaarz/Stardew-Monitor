<svg xmlns="http://www.w3.org/2000/svg" width="900" height="560" viewBox="0 0 900 560" shape-rendering="crispEdges" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="900" height="560" fill="#2b2b2b"/>
  <circle cx="24" cy="20" r="6" fill="#ef4444"/><circle cx="44" cy="20" r="6" fill="#f59e0b"/><circle cx="64" cy="20" r="6" fill="#22c55e"/>
  <rect x="90" y="8" width="520" height="24" fill="#1c1c1c"/>
  <text x="104" y="25" font-size="13" fill="#d1d5db">🔒 stardewmonitor.netlify.app</text>
  <rect x="0" y="40" width="900" height="520" fill="#7cc4ec"/>
  <rect x="0" y="40" width="900" height="56" fill="#8a5a2a"/>
  <rect x="0" y="92" width="900" height="4" fill="#4a2f18"/>
  <text x="24" y="76" font-family="'Press Start 2P', 'Courier New', monospace" font-size="20" font-weight="900" fill="#fff3d6">STARDEW MONITOR</text>

  <rect x="40" y="112" width="820" height="404" fill="#4a2f18"/>
  <rect x="46" y="118" width="808" height="392" fill="#f6e7c1"/>
  <rect x="46" y="118" width="808" height="40" fill="#c9a36a"/>
  <text x="66" y="145" font-size="18" font-weight="800" fill="#3b2412">🌾 A fazenda mora no seu computador</text>
  <text x="66" y="184" font-size="13.5" fill="#3b2412">O Stardew Monitor mostra os dados <tspan font-weight="800">reais</tspan> do computador (CPU, memória, discos, rede, GPU, temperaturas…).</text>
  <text x="66" y="204" font-size="13.5" fill="#3b2412">Um site não consegue ler o hardware de quem o visita, então o monitor roda como <tspan font-weight="800">aplicativo local</tspan>.</text>

  <rect x="66" y="220" width="768" height="40" fill="#e7f6ec" stroke="#16a34a" stroke-width="2"/>
  <text x="82" y="245" font-size="13.5" fill="#166534">🔎 Procurando o Stardew Monitor neste computador (portas 3001 a 3005)…  ➜  ✅ Encontrei! [Abrir meu painel]</text>

  <text x="66" y="290" font-size="15" font-weight="800" fill="#5e3a18">1. Baixe o aplicativo Stardew Monitor</text>
  <rect x="66" y="302" width="300" height="36" fill="#4a2f18"/><rect x="69" y="305" width="294" height="30" fill="#4caf50"/>
  <text x="216" y="325" font-size="13" font-weight="800" fill="#ffffff" text-anchor="middle">⬇️ Baixar para Windows (.exe, ~90 MB)</text>
  <text x="382" y="325" font-size="12" fill="#7a5a3a">StardewMonitor-windows-x64.exe · Linux: gere pelo código-fonte</text>

  <text x="66" y="372" font-size="15" font-weight="800" fill="#5e3a18">2. Abra o arquivo</text>
  <text x="66" y="394" font-size="13" fill="#3b2412">Dois cliques. Se o Windows avisar, clique em <tspan font-weight="800">Mais informações → Executar assim mesmo</tspan>.</text>

  <text x="66" y="428" font-size="15" font-weight="800" fill="#5e3a18">3. Use o painel</text>
  <text x="66" y="450" font-size="13" fill="#3b2412">O navegador abre sozinho em <tspan fill="#1d4ed8" text-decoration="underline">http://localhost:3001</tspan>, com a fazenda do seu computador.</text>

  <rect x="66" y="468" width="150" height="28" fill="#c9a36a" stroke="#4a2f18" stroke-width="2"/><text x="141" y="487" font-size="12" font-weight="700" fill="#3b2412" text-anchor="middle">🔁 Verificar de novo</text>
  <rect x="226" y="468" width="290" height="28" fill="#c9a36a" stroke="#4a2f18" stroke-width="2"/><text x="371" y="487" font-size="12" font-weight="700" fill="#3b2412" text-anchor="middle">Já está aberto? Ir para localhost:3001</text>

  <text x="450" y="540" font-size="12" fill="#1e3a5f" text-anchor="middle">Stardew Monitor · fan-made · os dados nunca saem do seu computador</text>
</svg>
